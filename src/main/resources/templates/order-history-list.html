<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Order History List</title>
</head>
<body>
<h1>Order History List</h1>
<table border="1">
  <thead>
  <tr>
    <th>Order Id</th>
    <th>Author</th>
    <th>Status</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="order : ${orders}">
    <td th:text="${order.id}"></td>
    <td th:text="${order.author}"></td>
    <td th:text="${order.status}"></td>
  </tr>
  </tbody>
</table>
</body>
</html>
